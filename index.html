<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#F4F6FA;--card:#fff;--ink:#14213D;--mut:#5B6577;--line:#D8DEE9;--pri:#14213D;--onpri:#fff;--ok:#1B7F4B;--bad:#C62F3A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1522;--card:#18202F;--ink:#E8ECF4;--mut:#9AA5B8;--line:#2A3547;--pri:#E8ECF4;--onpri:#0F1522;--ok:#4CC38A;--bad:#FF7A83}}
:root[data-theme="dark"]{--bg:#0F1522;--card:#18202F;--ink:#E8ECF4;--mut:#9AA5B8;--line:#2A3547;--pri:#E8ECF4;--onpri:#0F1522;--ok:#4CC38A;--bad:#FF7A83}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;color:var(--mut);font-size:14px;margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:13px}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.mut{color:var(--mut);font-size:14px}
.warn{color:var(--bad)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 0;display:flex;flex-direction:column;align-items:center}
.chip small{color:var(--mut);font-size:11px;line-height:1.2}
.chip b{font-size:20px;line-height:1.2}
.chip.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.chip.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
